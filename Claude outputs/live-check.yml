name: Canli Yayin ve Yeni Video Takibi

"on":
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: live-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Repoyu indir
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Listeyi Google E-Tablosu'ndan senkronize et
        env:
          CHANNELS_SHEET_CSV_URL: ${{ vars.CHANNELS_SHEET_CSV_URL }}
        run: node scripts/sync-channels.mjs

      - name: Durumu kontrol et
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node scripts/check-status.mjs

      - name: Degisiklik varsa commit'le ve gonder
        run: |
          git config user.name "deathko-bot"
          git config user.email "actions@users.noreply.github.com"
          git add status.json data/resolved-ids.json channels.json
          if git diff --cached --quiet; then
            echo "Degisiklik yok, cikiliyor."
            exit 0
          fi
          git commit -m "Durum guncellendi [otomatik]"

          # Ayni anda calisan baska bir otomasyon turu araya girip push'u
          # reddedebilir. status.json/channels.json her turda sifirdan
          # hesaplandigi icin boyle bir cakismada kendi (en taze) halimizi
          # esas almak guvenli - birkac saniye icinde tekrar deneriz.
          for i in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main -X ours && git push origin HEAD:main; then
              echo "Push basarili (deneme $i)."
              exit 0
            fi
            echo "Push basarisiz oldu (deneme $i), tekrar denenecek."
            git rebase --abort || true
            sleep $((RANDOM % 6 + 2))
          done

          echo "Push birkac denemeden sonra basarisiz oldu."
          exit 1
